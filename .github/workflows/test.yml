# The staff app tests. build.yml calls this file on each push to master that
# changes staff/: the tests run first, one time; the build only after them.
# "Run workflow" on the Actions tab runs only the tests.
# Two time zones: a date bug made with UTC (toISOString) shows only when the
# clock is not UTC. Sofia is the real zone; UTC is what most servers use.
name: Staff tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [Europe/Sofia, UTC]
    defaults:
      run:
        working-directory: staff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: staff/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          TZ: ${{ matrix.tz }}
