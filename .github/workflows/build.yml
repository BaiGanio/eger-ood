# Tests, then builds the staff app file for Windows, Linux and Mac (chapter 09, D32).
# Each push to master that changes staff/ runs the tests (test.yml) one time.
# The build runs only after they pass, and only when a version is due.
# caxa packs the Node of the computer that runs the build, so each system
# builds on its own GitHub computer. setup-node gives the Node of nodejs.org
# (one file, no libnode), so tools/build.mjs does not stop.
#
#   Push to master with a "feat:" / "fix:" / "perf:" / "...!:" commit that
#   changes staff/  →  a new version tag and a GitHub Release with three zips.
#   (Rules: staff/tools/next-version.mjs.) Other commits: no build.
#   "Run workflow" on the Actions tab  →  a test build: the same zips as a run
#   artifact, no tag, no Release.
#
# The built files never go into git. They have no data and no keys.
name: Staff tests and build

on:
  push:
    branches: [master]
    paths:
      - 'staff/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, so two quick pushes never get the same version number.
concurrency:
  group: build-staff
  cancel-in-progress: false

jobs:
  # test.yml, both time zones. Nothing below starts if one fails.
  tests:
    uses: ./.github/workflows/test.yml

  version:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all commits and tags
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - id: next
        if: github.event_name == 'push'
        run: node staff/tools/next-version.mjs

  build:
    needs: version
    if: needs.version.outputs.version != '' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
          - os: macos-latest   # Apple chip (arm64)
            name: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: staff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: staff/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: staff/dist/
          if-no-files-found: error
          retention-days: 7

  # One job packs the three files. A zip keeps the run mark (chmod +x) of the
  # Mac and Linux files; the artifact upload loses it. The zip names are Latin,
  # because GitHub changes the non-Latin letters in the name of a Release file.
  # In each zip the file keeps its name ЕГЕР-Сервиз(.exe) of ИНСТРУКЦИЯ.md.
  package:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to make the tag and the Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: in
      - name: Make the zip files
        run: |
          mkdir out
          chmod +x in/build-linux/* in/build-mac/*
          for n in windows linux mac; do
            (cd "in/build-$n" && zip -X "../../out/EGER-Servis-$n.zip" *)
          done
          ls -l out
      - if: needs.version.outputs.version != ''
        name: Make the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: >
          gh release create "$VERSION" out/*.zip
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "$VERSION" --generate-notes
      - if: needs.version.outputs.version == ''
        uses: actions/upload-artifact@v4
        with:
          name: EGER-Servis-test
          path: out/
          retention-days: 30
